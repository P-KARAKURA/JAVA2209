<!DOCTYPE html>
 <html>
 <head>
 	<title>JavaScript Practice</title>
	<style> 
		body {
    font-family: Arial, sans-serif;
    background-color: #f2f5f7;
    text-align: center;
    padding: 30px;
}

#bodyStyle {
    background-color: white;
    padding: 25px;
    border-radius: 12px;
    max-width: 600px;
    margin: auto;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
}

h1 {
    color: #243447;
}

p {
    color: #555;
}

input {
    padding: 10px;
    margin: 5px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    padding: 10px 15px;
    margin: 5px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    background-color: #243447;
    color: white;
}

button:hover {
    opacity: 0.85;
}

h2 {
    color: #243447;
}
#message {
    padding: 15px 20px;
    margin: 20px auto;
    max-width: 450px;
    border-radius: 10px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: white;
    transition: 0.3s;
}
	</style>
 </head>
 <body>
	<div id="bodyStyle">
		<h1 id="title">JavaScript Practice</h1>

 	<p id="message">Hello students!</p>

 	<input id="nameInput" type="text" placeholder="Enter your name">

 	<button id="helloButton">Say Hello</button>

 	<h2 id="result">We are eager to know your status</h2>

 	<button id="increaseButton">Increase</button>
 	<button id="decreaseButton">Decrease</button>
 	<button id="resetButton">Reset</button>
	<button id="changemessage">Change message</button>


 	<h2 id="counter">0</h2>

	<input id="ageInput" type="number" placeholder="Enter your age">
<button id="checkAgeButton">Write your Class ID</button>

<h2 id="result2">Did you know that your time is limited?</h2>

<button id="redButton">Red</button>
<button id="blueButton">Blue</button>
<button id="greenButton">Green</button>
<button id="choiceButton">Choose your favorite backround</button>
	</div>

 	

 	<script src="script.js"></script>
 </body>
 </html>
